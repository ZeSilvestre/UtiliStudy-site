<div class="screenshot-frame">
  <div class="screenshot-frame__chrome" aria-hidden="true">
    <div class="screenshot-frame__dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  <div class="screenshot-frame__viewport">
    @if (video) {
      <video
        #mediaVideo
        class="screenshot-frame__media screenshot-frame__media--video"
        [src]="video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
        [attr.aria-label]="alt"
        [style.transform]="'scale(' + crop.scale + ')'"
      ></video>
    } @else if (src) {
      <img
        class="screenshot-frame__media"
        [src]="src"
        [alt]="alt"
        [attr.loading]="eager ? 'eager' : 'lazy'"
        [style.transform]="'scale(' + crop.scale + ')'"
      />
    }
  </div>
</div>
