<header class="topbar">
  <div class="topbar-content">
    <a routerLink="/" class="brand" aria-label="Página inicial UtiliStudy">
      <img src="assets/images/branding/icon-utilistudy.png" alt="Ícone UtiliStudy" />
      <span>UtiliStudy</span>
    </a>

    <nav class="menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a routerLink="/download" routerLinkActive="active">Download</a>
      <a routerLink="/politica-privacidade" routerLinkActive="active">Política de Privacidade</a>
      <p-button
        label="Download"
        icon="pi pi-download"
        size="small"
        severity="success"
        [raised]="true"
        routerLink="/download"
      ></p-button>
    </nav>
  </div>
</header>

<main class="page-content">
  <router-outlet></router-outlet>
</main>
