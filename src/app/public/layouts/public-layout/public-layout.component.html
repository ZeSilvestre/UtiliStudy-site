<header class="topbar">
  <div class="topbar-content">
    <a routerLink="/" class="brand" aria-label="Página inicial UtiliStudy">
      <img [src]="brand.icon" alt="UtiliStudy" class="brand-icon" />
      <span class="brand-name">UtiliStudy</span>
    </a>

    <nav class="menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a href="/#recursos" class="nav-anchor">Recursos</a>
      <a href="/#precos" class="nav-anchor">Preços</a>
      <a routerLink="/download" routerLinkActive="active">Download</a>
      <p-button
        label="Testar grátis"
        icon="pi pi-download"
        size="small"
        severity="success"
        [raised]="true"
        routerLink="/download"
      ></p-button>
    </nav>
  </div>
</header>

<main class="page-content">
  <router-outlet></router-outlet>
</main>
