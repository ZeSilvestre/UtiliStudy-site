<section class="download-section">
  <div class="download-card">
    <div class="download-brand">
      <img [src]="brand.icon" alt="UtiliStudy" class="download-brand-icon" />
    </div>

    <h1>Baixar UtiliStudy</h1>
    <p class="download-meta">{{ config.platform }} · v{{ config.version }}</p>
    <p class="download-scope">{{ appScope.title }}. {{ appScope.summary }}</p>

    <p-button
      class="download-btn"
      label="Baixar instalador"
      icon="pi pi-download"
      size="large"
      severity="success"
      [raised]="true"
      (onClick)="onDownload()"
    ></p-button>

    @if (!downloadAvailable) {
      <p class="download-status">Disponível em breve.</p>
    }

    <a routerLink="/" class="back-link">← Voltar ao site</a>
  </div>
</section>
