<section class="section">
  <div class="container">
    <h2>Veja o app em ação</h2>

    <div class="carousel-mask" style="margin-top: 3rem;">
      <div class="carousel-track">
        @for (print of printsLoop; track $index) {
          <article class="slide">
            <div class="mock-shot">
              @if (print.imagem) {
                <img [src]="print.imagem" [alt]="print.titulo" />
              } @else {
                <div class="placeholder-content">
                  <i class="pi pi-image"></i>
                  <span>Espaço para screenshot</span>
                </div>
              }
            </div>
            <h3>{{ print.titulo }}</h3>
          </article>
        }
      </div>
    </div>
  </div>
</section>
