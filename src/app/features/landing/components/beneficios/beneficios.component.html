<section class="section">
  <div class="container">
    <h2>Benefícios para sua rotina</h2>
    <p class="subtitle">Tudo o que você precisa para estudar com mais constância e tranquilidade.</p>

    <div class="benefits-list">
      @for (beneficio of beneficios; track beneficio.titulo; let i = $index) {
        <article class="benefit-item" [class.reverse]="i % 2 === 1">
          <div class="benefit-copy">
            <h3>{{ beneficio.titulo }}</h3>
            <p>{{ beneficio.texto }}</p>
          </div>

          <div class="benefit-media">
            @if (beneficio.imagem) {
              <img [src]="beneficio.imagem" [alt]="beneficio.titulo" />
            } @else {
              <div class="media-placeholder">
                <i class="pi pi-image"></i>
                <span>Espaço para imagem desta seção</span>
              </div>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
