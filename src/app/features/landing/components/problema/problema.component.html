<section class="section">
  <div class="container">
    <p-card styleClass="problem-card">
      <div class="problem-layout">
        <div class="problem-copy">
          <p-tag value="Situação comum" severity="contrast"></p-tag>
          <h2>Você sente que estuda muito, mas fica perdido?</h2>
          <p>
            Cada matéria em um app, tarefas espalhadas e pouca visão do que já foi feito. No fim do
            dia, bate a sensação de cansaço sem resultado.
          </p>
        </div>

        <div class="problem-highlights">
          <p-tag value="Desorganização" [rounded]="true"></p-tag>
          <p-tag value="Muitos apps" [rounded]="true"></p-tag>
          <p-tag value="Falta de controle" [rounded]="true"></p-tag>
        </div>
      </div>
    </p-card>
  </div>
</section>
