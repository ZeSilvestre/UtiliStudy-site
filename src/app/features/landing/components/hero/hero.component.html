<section class="hero-section">
  <div class="hero-glow hero-glow--left"></div>
  <div class="hero-glow hero-glow--right"></div>

  <div class="container">
    <div class="hero-copy">

      <h1>
        Estude com método.<br />
        <span class="hero-accent">Acompanhe cada avanço.</span>
      </h1>

      <p class="hero-lead">
        Organize sua rotina de estudos: planejamento, cronômetro, relatórios e métricas em um
        app desktop
      </p>

      <aside class="scope-notice scope-notice--hero" aria-label="O que o UtiliStudy é e não é">
        <p class="scope-notice__title">
          <i class="pi pi-info-circle" aria-hidden="true"></i>
          {{ appScope.title }}
        </p>
        <p class="scope-notice__text">{{ appScope.summary }}</p>
      </aside>

      <div class="hero-actions">
        <a class="hero-link" href="#recursos">Ver recursos</a>
      </div>

      <ul class="hero-trust">
        <li><i class="pi pi-check"></i> Sem compromisso no período de teste</li>
        <li><i class="pi pi-check"></i> Login com Google em segundos</li>
      </ul>
    </div>

    <div class="hero-visual">
      <app-screenshot-frame
        [video]="heroVideo"
        [alt]="heroTitle"
      ></app-screenshot-frame>
      <div class="hero-visual__shadow"></div>
    </div>
  </div>
</section>
