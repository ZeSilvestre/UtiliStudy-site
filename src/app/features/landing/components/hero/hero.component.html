<section class="hero-section">
  <div class="container">
    <div class="hero-copy">
      <p-tag value="UtiliStudy" severity="contrast"></p-tag>
      <h1>Seu plano de estudos completo, em um app simples de usar.</h1>
      <p>
        Organize matérias, acompanhe seu progresso e mantenha o foco em um só lugar, com uma
        experiência clara, moderna e confiável.
      </p>

      <p class="hero-plan-note">
        Plano de uso — R$ 14,99 por mês, assinatura mensal contratada no aplicativo desktop.
      </p>

      <div class="hero-actions">
        <p-button
          label="Download"
          icon="pi pi-download"
          size="large"
          severity="success"
          [raised]="true"
          routerLink="/download"
        ></p-button>
      </div>
    </div>

    <div class="hero-visual">
      <img src="assets/images/branding/logo-utilistudy.png" alt="Logo UtiliStudy" class="hero-logo" />
    </div>
  </div>
</section>
