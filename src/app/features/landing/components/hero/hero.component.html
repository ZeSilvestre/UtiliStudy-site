<section class="hero-section">
  <div class="container">
    <div class="hero-copy">
      <p-tag value="UtiliStudy" severity="contrast"></p-tag>
      <h1>Seu plano de estudos completo, em um app simples de usar.</h1>
      <p>
        Organize matérias, acompanhe seu progresso e mantenha o foco em um só lugar, com uma
        experiência clara, moderna e confiável.
      </p>

      <div class="hero-actions">
        <p-button
          label="Instalar pela Microsoft Store"
          icon="pi pi-microsoft"
          size="large"
          [raised]="true"
          (onClick)="openStore()"
        ></p-button>
      </div>

      <div class="trust-badges">
        <span>✔ Instalação segura</span>
        <span>✔ Sem vírus</span>
        <span>✔ Atualizações automáticas</span>
      </div>
    </div>

    <div class="hero-visual">
      <img src="assets/images/branding/logo-utilistudy.png" alt="Logo UtiliStudy" class="hero-logo" />
    </div>
  </div>
</section>
